<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="zcode-auto-continue icon">
  <!-- 自动继续：圆环重试箭头（故障自愈）+ 播放三角（继续任务），莫奈《睡莲》配色 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FA8CE"/>
      <stop offset="0.55" stop-color="#B39DCE"/>
      <stop offset="1" stop-color="#93BFA8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <circle cx="28" cy="26" r="30" fill="#F6F0E2" opacity="0.27"/>
    <circle cx="112" cy="104" r="34" fill="#8FB8A5" opacity="0.31"/>
    <circle cx="108" cy="30" r="24" fill="#D9A8B8" opacity="0.22"/>
    <circle cx="20" cy="112" r="26" fill="#C9BCE2" opacity="0.25"/>
  </g>
  <!-- 270° 圆弧，缺口朝右上 -->
  <path d="M 81 34.6 A 34 34 0 1 1 34.6 47" fill="none" stroke="#F6F0E2" stroke-width="11" stroke-linecap="round"/>
  <!-- 弧末端的箭头（沿切线方向 60° 朝右上） -->
  <polygon points="14,0 -8,10 -8,-10" transform="translate(34.6 47) rotate(-60)" fill="#F6F0E2"/>
  <!-- 中央播放三角 -->
  <polygon points="55,50 83,64 55,78" fill="#F6F0E2"/>
</svg>
